# Render Blueprint: deploys the Django API on Render's free plan.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker keeps the in-memory forecast cache shared; threads handle concurrency.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # The Vercel project "weather-aware-truck-routing": production + preview URLs.
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://weather-aware-truck-routing[a-z0-9-]*\.vercel\.app$
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
